<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Peearh</title>
  <style>
    :root {
      --desk: #b8b8b8;
      --bar: #2b2b2b;
      --bar-text: #c8c8c8;
      --bg: #1c1c1c;
      --side: #161616;
      --fg: #e6e6e6;
      --dim: #6e6e6e;
      --line: #2e2e2e;
      --green: #32d74b;
      --red: #ff453a;
      --amber: #ffd60a;
      --cyan: #64d2ff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--desk); }
    body {
      font: 13px/1.5 "SF Mono", Menlo, Monaco, "Courier New", monospace;
      color: var(--fg);
      padding: 18px;
    }
    .win {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.2);
    }
    .bar {
      flex: 0 0 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: var(--bar);
      color: var(--bar-text);
      font-size: 12px;
      user-select: none;
    }
    .dots { position: absolute; left: 12px; display: flex; gap: 7px; }
    .dots i { width: 12px; height: 12px; border-radius: 50%; display: block; }
    .dots .c { background: #ff5f57; }
    .dots .n { background: #febc2e; }
    .dots .o { background: #28c840; }
    .body {
      flex: 1;
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 0;
    }
    .sessions {
      background: var(--side);
      border-right: 1px solid var(--line);
      overflow: auto;
      padding: 10px 0 16px;
    }
    .sessions h2 {
      margin: 0 12px 8px;
      font-size: 11px;
      font-weight: 500;
      color: var(--dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .reasoning {
      overflow: auto;
      padding: 14px 16px 32px;
    }
    a.job {
      display: block;
      color: inherit;
      text-decoration: none;
      padding: 6px 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    a.job:hover { background: #222; }
    a.job.on { background: #2a2a2a; }
    .row { display: flex; gap: 10px; align-items: flex-start; }
    .g { width: 1.4em; flex: 0 0 1.4em; text-align: center; }
    .g.ok { color: var(--green); }
    .g.bad { color: var(--red); }
    .g.run { color: var(--amber); }
    .g.skip { color: var(--dim); }
    .g.think { color: var(--cyan); }
    .dim { color: var(--dim); }
    .prompt { color: var(--green); }
    pre {
      margin: 0;
      font: inherit;
      color: var(--fg);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .blk {
      margin: 0.2em 0 0.85em 2.4em;
      color: var(--fg);
    }
    .empty { color: var(--dim); padding: 0 12px; }
    @media (max-width: 720px) {
      body { padding: 0; }
      .win { border-radius: 0; }
      .body { grid-template-columns: 1fr; grid-template-rows: 32% 1fr; }
      .sessions { border-right: 0; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <div class="win">
    <div class="bar">
      <div class="dots" aria-hidden="true"><i class="c"></i><i class="n"></i><i class="o"></i></div>
      <span>peearh — 127.0.0.1:8008</span>
    </div>
    <div class="body">
      <nav class="sessions" id="sessions" aria-label="sessions"></nav>
      <main class="reasoning" id="reasoning"></main>
    </div>
  </div>
  <script>
    const sessionsEl = document.getElementById("sessions");
    const reasoningEl = document.getElementById("reasoning");
    let selected = location.hash.replace("#", "") || null;
    let cache = [];
    const frames = ["⠋","⠙","⠹","⠸","⠼","⠴","⠦","⠧","⠇","⠏"];
    let tickN = 0;
    let stick = true;

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function live(job) {
      return job.status === "running" || job.status === "accepted";
    }

    function jobGlyph(job) {
      if (job.status === "done") return { cls: "ok", html: "✓" };
      if (job.status === "failed") return { cls: "bad", html: "✗" };
      if (job.status === "ignored" || job.status === "duplicate") return { cls: "skip", html: "○" };
      return { cls: "run", html: "spin" };
    }

    function eventGlyph(job, ev, i, events) {
      const last = i === events.length - 1;
      if (ev.kind === "failed") return { cls: "bad", html: "✗" };
      if (ev.kind === "done") return { cls: "ok", html: "✓" };
      if (ev.kind === "skip") return { cls: "skip", html: "○" };
      if (ev.kind === "reasoning") return { cls: "think", html: "✻" };
      if (live(job) && last) return { cls: "run", html: "spin" };
      return { cls: "ok", html: "✓" };
    }

    function nearBottom(el, slop) {
      return el.scrollHeight - el.scrollTop - el.clientHeight <= (slop ?? 64);
    }

    function scrollToNewest() {
      reasoningEl.scrollTop = reasoningEl.scrollHeight;
    }

    reasoningEl.addEventListener("scroll", () => {
      stick = nearBottom(reasoningEl);
    });

    function glyphHtml(g, spin) {
      if (g.html === "spin") {
        return `<span class="spin-slot">${esc(spin)}</span>`;
      }
      return g.html;
    }

    function renderSessions() {
      const spin = frames[tickN % frames.length];
      const rows = [`<h2>sessions</h2>`];
      if (!cache.length) {
        rows.push(`<p class="empty">no sessions yet</p>`);
        sessionsEl.innerHTML = rows.join("");
        return;
      }
      cache.forEach((job) => {
        const g = jobGlyph(job);
        const label = `${job.repo}${job.pr_number != null ? " #" + job.pr_number : ""}`;
        const on = job.id === selected ? " on" : "";
        rows.push(
          `<a class="job${on}" href="#${esc(job.id)}" data-id="${esc(job.id)}">` +
          `<span class="g ${g.cls}">${glyphHtml(g, spin)}</span>` +
          `${esc(label)}` +
          `</a>`
        );
      });
      sessionsEl.innerHTML = rows.join("");
      sessionsEl.querySelectorAll("a.job").forEach((el) => {
        el.addEventListener("click", (e) => {
          e.preventDefault();
          selected = el.dataset.id;
          location.hash = selected;
          stick = true;
          renderSessions();
          renderReasoning();
        });
      });
    }

    function renderReasoning() {
      const pin = stick || nearBottom(reasoningEl);
      const y = reasoningEl.scrollTop;
      const spin = frames[tickN % frames.length];
      const job = cache.find((j) => j.id === selected);
      if (!cache.length) {
        reasoningEl.innerHTML =
          `<span class="prompt">peearh %</span> watch\n` +
          `<div class="dim"># Peearh · live review reasoning</div>` +
          `<p class="empty" style="padding:12px 0">Waiting for a webhook. Open or push a PR, then the full model reasoning appears here.</p>`;
        return;
      }
      if (!job) {
        reasoningEl.innerHTML = `<p class="empty">Select a session.</p>`;
        return;
      }
      const title = `${job.repo}${job.pr_number != null ? " #" + job.pr_number : ""}`;
      const parts = [
        `<span class="prompt">peearh %</span> session ${esc(title)}\n`,
        `<div class="dim">${esc(job.status)}  ${esc(job.action || "—")}  ${esc((job.head_sha || "").slice(0, 12))}</div>\n`,
      ];
      const events = job.events || [];
      events.forEach((ev, i) => {
        const g = eventGlyph(job, ev, i, events);
        parts.push(
          `<div class="row"><span class="g ${g.cls}">${glyphHtml(g, spin)}</span><span>${esc(ev.message)}</span></div>`
        );
        if (ev.detail) {
          parts.push(`<div class="blk"><pre>${esc(ev.detail)}</pre></div>`);
        }
      });
      if (live(job)) {
        parts.push(`<div class="row"><span class="g run"><span class="spin-slot">${esc(spin)}</span></span><span>working…</span></div>`);
      } else if (job.status === "done") {
        parts.push(`<div class="row"><span class="g ok">✓</span><span>done</span></div>`);
      } else if (job.status === "failed") {
        parts.push(`<div class="row"><span class="g bad">✗</span><span>${esc(job.error || "failed")}</span></div>`);
      }
      reasoningEl.innerHTML = parts.join("");
      if (pin) scrollToNewest();
      else reasoningEl.scrollTop = y;
    }

    function render() {
      renderSessions();
      renderReasoning();
    }

    function spinOnly() {
      tickN += 1;
      const ch = frames[tickN % frames.length];
      document.querySelectorAll(".spin-slot").forEach((el) => { el.textContent = ch; });
    }

    async function poll() {
      try {
        const res = await fetch("/jobs");
        const data = await res.json();
        cache = data.jobs || [];
        if (!selected && cache.length) selected = cache[0].id;
      } catch (_) { /* keep last frame */ }
      render();
    }

    setInterval(spinOnly, 80);
    poll();
    setInterval(poll, 1500);
  </script>
</body>
</html>
